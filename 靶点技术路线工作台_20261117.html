// ============ Excel 导出 ============
// 通用导出：rows = [{列名:值,...}, ...]，导出为 .xlsx
function exportXlsx(rows, sheetName, fileName){
  if(typeof XLSX === 'undefined'){
    alert('Excel 导出组件未加载成功，请检查网络后刷新重试。');
    return;
  }
  if(!rows || rows.length === 0){
    alert('当前没有可导出的数据');
    return;
  }
  const ws = XLSX.utils.json_to_sheet(rows);
  // 自适应列宽（按内容长度估算，中文按 2 字符宽）
  const headers = Object.keys(rows[0]);
  const colWidths = headers.map(h => {
    let max = h.length * 2;
    rows.forEach(r => {
      const v = r[h]===null || r[h]===undefined ? '' : String(r[h]);
      const len = v.split('').reduce((s,c)=> s + (c.charCodeAt(0) > 255 ? 2 : 1), 0);
      if(len > max) max = len;
    });
    return { wch: Math.min(max + 2, 60) };
  });
  ws['!cols'] = colWidths;
  const wb = XLSX.utils.book_new();
  // Sheet 名清洗：SheetJS 禁止 : \ / ? * [ ]，且长度≤31
  const safeSheet = String(sheetName).replace(/[\\/:*?\[\]()]/g, '-').slice(0, 31);
  XLSX.utils.book_append_sheet(wb, ws, safeSheet);
  XLSX.writeFile(wb, fileName);
}

// 规范时间戳（文件名用）
function ts(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}

// ============ 企业清单 ============
function renderCompanies(v){
  v.innerHTML = `
    <div class="filters">
      <div class="fgroup"><label>靶点</label><select id="fTarget"><option value="">全部靶点</option>${TARGETS.slice(0,200).map(t=>`<option value="${t}">${t} (${targetFreq[t]})</option>`).join('')}</select></div>
      <div class="fgroup"><label>技术路线</label><select id="fMod"><option value="">全部路线</option>${MODS.map(m=>`<option value="${m}">${m} (${modFreq[m]||0})</option>`).join('')}</select></div>
      <div class="fgroup"><label>优先级</label><select id="fPri"><option value="">全部</option><option value="S">S</option><option value="A">A</option><option value="B">B</option><option value="C">C</option></select></div>
      <div class="fgroup"><label>搜索</label><input id="fSearch" placeholder="企业名关键词" oninput="renderCompanyTable()"></div>
      <button class="btn primary" onclick="renderCompanyTable()">搜索</button>
      <button class="btn" onclick="resetCompanyFilter()">重置</button>
      <button class="btn" style="background:var(--green);color:#fff;border-color:var(--green);" onclick="exportCompanies()">⬇ 导出Excel</button>
      <div style="margin-left:auto;" class="view-toggle">
        <button class="${viewMode==='table'?'active':''}" onclick="setViewMode('table')">表格</button>
        <button class="${viewMode==='card'?'active':''}" onclick="setViewMode('card')">卡片</button>
      </div>
    </div>
    <div class="panel">
      <div id="companyResult"></div>
    </div>
  `;
  // 绑定筛选事件
  ['fTarget','fMod','fPri'].forEach(id=>{
    document.getElementById(id).onchange = renderCompanyTable;
  });
  renderCompanyTable();
}

function setViewMode(m){
  viewMode = m;
  renderCompanies(document.getElementById('view'));
}

function resetCompanyFilter(){
  document.getElementById('fTarget').value='';
  document.getElementById('fMod').value='';
  document.getElementById('fPri').value='';
  document.getElementById('fSearch').value='';
  renderCompanyTable();
}

function filterCompanies(){
  const t = document.getElementById('fTarget').value;
  const m = document.getElementById('fMod').value;
  const p = document.getElementById('fPri').value;
  const kw = (document.getElementById('fSearch').value||'').trim();
  return ENTS.filter(e=>{
    if(t && !e.tg.includes(t)) return false;
    if(m && !e.md.includes(m)) return false;
    if(p && e.pr!==p) return false;
    if(kw && !e.n.includes(kw)) return false;
    return true;
  });
}

function renderCompanyTable(){
  const list = filterCompanies();
  const box = document.getElementById('companyResult');
  if(list.length===0){
    box.innerHTML = '<div class="empty">没有匹配的企业，试试放宽筛选条件</div>';
    return;
  }
  const topN = list.slice(0,200);
  if(viewMode==='card'){
    box.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:10px;">匹配 ${list.length} 家，展示前 ${topN.length} 家</div>
      <div class="grid-cards">${topN.map(ecard).join('')}</div>`;
  }else{
    box.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:10px;">匹配 ${list.length} 家，展示前 ${topN.length} 家</div>
      <div style="max-height:600px;overflow:auto;"><table>
      <thead><tr><th>企业</th><th>评分</th><th>优先级</th><th>相关性</th><th>管线</th><th>最高阶段</th><th>技术路线</th><th>核心靶点</th><th>推荐产品线</th></tr></thead>
      <tbody>${topN.map(erow).join('')}</tbody></table></div>`;
  }
}

function ecard(e){
  const sc = e.sc!==null&&e.sc!==''?`<span class="score">${e.sc}</span>`:'';
  const pr = e.pr?`<span class="priority-${e.pr}">${e.pr}</span>`:'';
  return `<div class="ecard">
    <div class="ename"><span>${e.n}</span><span>${sc}${pr}</span></div>
    <div class="meta">管线 ${e.pc} 条 · 最高 ${e.ph||'-'}${e.iph?` · intel ${e.iph}`:''}</div>
    <div class="chips">${e.md.slice(0,4).map(m=>`<span class="chip md">${m}</span>`).join('')}${e.md.length>4?`<span class="chip md">+${e.md.length-4}</span>`:''}</div>
    <div class="chips">${e.tg.slice(0,6).map(t=>`<span class="chip tg">${t}</span>`).join('')}${e.tg.length>6?`<span class="chip tg">+${e.tg.length-6}</span>`:''}</div>
    ${e.pd&&e.pd!=='— 体量不足，暂无推荐'?`<div style="font-size:11px;color:var(--muted);margin-top:6px;">推荐：${e.pd}</div>`:''}
  </div>`;
}

function erow(e){
  const sc = e.sc!==null&&e.sc!==''?`<span class="score">${e.sc}</span>`:'-';
  const pr = e.pr?`<span class="priority-${e.pr}">${e.pr}</span>`:'-';
  const rl = e.rl?`<span class="badge ${e.rl==='S'||e.rl==='A'?'s':''}">${e.rl}</span>`:'-';
  return `<tr>
    <td style="font-weight:600;">${e.n}</td>
    <td>${sc}</td>
    <td>${pr}</td>
    <td>${rl}</td>
    <td>${e.pc}</td>
    <td>${e.ph||'-'}</td>
    <td>${e.md.slice(0,3).join('、')}${e.md.length>3?'…':''}</td>
    <td>${e.tg.slice(0,5).join('、')}${e.tg.length>5?'…':''}</td>
    <td style="max-width:220px;font-size:11px;color:var(--muted);">${e.pd||''}</td>
  </tr>`;
}

// 导出企业清单（当前筛选结果全量，不限前200）
function exportCompanies(){
  const list = filterCompanies();
  if(list.length===0){ alert('当前没有可导出的数据'); return; }
  const rows = list.map(e=>({
    '企业': e.n,
    '评分': (e.sc!==null&&e.sc!=='')?e.sc:'',
    '优先级': e.pr||'',
    '相关性档': e.rl||'',
    '管线数': e.pc,
    '临床试验记录数': e.rc,
    '肿瘤记录数': e.trc||'',
    '最高阶段': e.ph||'',
    'intel最高阶段': e.iph||'',
    '技术路线': e.md.join('、'),
    '核心靶点': e.tg.join('、'),
    '适应症': e.ind.join('、'),
    '推荐产品线': e.pd||'',
  }));
  const t = document.getElementById('fTarget').value || '全部靶点';
  const m = document.getElementById('fMod').value || '全部路线';
  exportXlsx(rows, '企业清单', `企业清单_${t}_${m}_${ts()}.xlsx`);
}

// 某靶点下可选的适应症（记录级，随靶点动态）
function targetIndOptions(t){

// 某靶点下，按适应症聚合企业数（记录级精确口径）
function targetIndStats(t){
  return (TARGET_IND[t] || []).map(x=>({ind:x[0], n:x[1]}));
}

function renderTargetIndDist(){
  const t = document.getElementById('tTarget').value || TARGETS[0];
  const stats = targetIndStats(t);
  const box = document.getElementById('targetIndDist');
  const top = stats.slice(0, 15);
  if(stats.length===0){
    box.innerHTML = `<h2>靶点「${t}」适应症分布</h2><div class="empty">该靶点暂无适应症标注数据</div>`;
    return;
  }
  const max = top[0].n;
  const bars = top.map(({ind,n})=>{
    const w = Math.round(n/max*100);
    return `<div style="display:flex;align-items:center;gap:8px;margin:4px 0;">
      <div style="width:130px;text-align:right;font-size:12px;color:var(--ink);flex-shrink:0;">${ind}</div>
      <div style="flex:1;background:var(--blue-ll);border-radius:4px;height:20px;overflow:hidden;">
        <div style="width:${w}%;height:100%;background:linear-gradient(90deg,#378ADD,#185FA5);border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;">
          <span style="font-size:11px;color:#fff;font-weight:600;">${n}</span>
        </div>
      </div>
    </div>`;
  }).join('');
  box.innerHTML = `
    <h2>靶点「${t}」适应症分布 <span style="font-size:12px;color:var(--muted);font-weight:400;">共 ${stats.length} 个适应症，展示前 ${top.length}</span></h2>
    <div class="desc">该靶点的在研管线布局在哪些适应症、各有多少家企业（按临床试验记录精确统计，一家企业可布局多个适应症）</div>
    <div style="margin-top:8px;">${bars}</div>`;
}

function renderTargetDetail(){
  const t = document.getElementById('tTarget').value || TARGETS[0];
  let list = ENTS.filter(e=>e.tg.includes(t));
  if(targetIndFilter){
    // 适应症筛选：该企业布局该靶点时的适应症里是否包含所选适应症
    const cmap = TARGET_COMPANY_IND[t] || {};
    list = list.filter(e=>{
      const inds = cmap[e.n] || [];
      return inds.includes(targetIndFilter);
    });
  }
  list = list.sort((a,b)=>{
    const sa = (a.sc!==null&&a.sc!=='')?a.sc:0;
    const sb = (b.sc!==null&&b.sc!=='')?b.sc:0;
    return sb-sa || b.pc-a.pc;
  });
  const box = document.getElementById('targetDetail');
  const withScore = list.filter(e=>e.sc!==null&&e.sc!=='').length;
  const indLabel = targetIndFilter ? ` · 适应症「${targetIndFilter}」` : '';
  const cmap = TARGET_COMPANY_IND[t] || {};
  box.innerHTML = `
    <h2>靶点「${t}」${indLabel}布局企业 <span style="font-size:12px;color:var(--muted);font-weight:400;">共 ${list.length} 家（${withScore} 家有intel评分）</span></h2>
    <div style="max-height:560px;overflow:auto;margin-top:10px;"><table>
      <thead><tr><th>企业</th><th>评分</th><th>优先级</th><th>管线</th><th>最高阶段</th><th>技术路线</th><th>适应症（布局本靶点）</th></tr></thead>
      <tbody>${list.map(e=>{
        const inds = cmap[e.n] || [];
        return `<tr>
        <td style="font-weight:600;">${e.n}</td>
        <td>${e.sc!==null&&e.sc!==''?`<span class="score">${e.sc}</span>`:'-'}</td>
        <td>${e.pr?`<span class="priority-${e.pr}">${e.pr}</span>`:'-'}</td>
        <td>${e.pc}</td>
        <td>${e.ph||'-'}</td>
        <td>${e.md.join('、')}</td>
        <td style="font-size:11px;color:var(--muted);max-width:300px;">${inds.slice(0,6).join('、')}${inds.length>6?` <span style="color:var(--blue);">+${inds.length-6}</span>`:''}</td>
      </tr>`;
      }).join('')}</tbody></table></div>`;
}

// 导出靶点视图：当前靶点（+可选适应症）下的企业明细
function exportTarget(){
  const t = document.getElementById('tTarget').value || TARGETS[0];
  let list = ENTS.filter(e=>e.tg.includes(t));
  if(targetIndFilter){
    const cmap = TARGET_COMPANY_IND[t] || {};
    list = list.filter(e=> (cmap[e.n]||[]).includes(targetIndFilter));

  if(list.length===0){ alert('当前没有可导出的数据'); return; }

    '企业': e.n,
    '评分': (e.sc!==null&&e.sc!=='')?e.sc:'',

// ============ 靶点×技术路线 矩阵 ============
function renderMatrix(v){
  v.innerHTML = `
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2>靶点 × 技术路线 交叉热力图</h2>

      return ENTS.filter(e=>e.tg.includes(t)&&e.md.includes(m)).length;
    });
  });
  const chart = echarts.init(document.getElementById('chMatrix'));
  chart.setOption({
    tooltip:{position:'top'},
    grid:{left:110,right:80,top:40,bottom:80},
    xAxis:{type:'category',data:MODS,axisLabel:{rotate:30,fontSize:11}},
    yAxis:{type:'category',data:topTargets,axisLabel:{fontSize:11}},
    visualMap:{min:0,max:Math.max(...rows.flat()),calculable:true,orient:'vertical',right:10,top:'center',inRange:{color:['#E6F1FB','#B5D4F4','#378ADD','#185FA5','#0C447C']}},
    series:[{type:'heatmap',data:rows.map((row,i)=>row.map((v,j)=>[j,i,v])).flat(),
      label:{show:true,fontSize:10,color:'#fff',formatter:p=>p.value[2]>0?p.value[2]:''},
      itemStyle:{borderColor:'#fff',borderWidth:1}}]
  });
}

function exportMatrix(){
  if(typeof XLSX === 'undefined'){ alert('Excel 导出组件未加载成功，请检查网络后刷新重试。'); return; }
  const topTargets = TARGETS.slice(0,30);
  // 矩阵行：靶点，列：技术路线
  const header = ['靶点', ...MODS];
  const dataRows = topTargets.map(t=>{
    const row = { '靶点': t };
    MODS.forEach(m=>{ row[m] = ENTS.filter(e=>e.tg.includes(t)&&e.md.includes(m)).length; });
    return row;
  });
  const ws = XLSX.utils.json_to_sheet(dataRows, { header: header });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '靶点×技术路线矩阵');
  XLSX.writeFile(wb, `靶点×技术路线交叉矩阵_Top30_${ts()}.xlsx`);
}

// ============ 导出：总览统计 ============
function exportOverview(){
  if(typeof XLSX === 'undefined'){ alert('Excel 导出组件未加载成功，请检查网络后刷新重试。'); return; }
  const wb = XLSX.utils.book_new();
  // Sheet1: 核心统计
  const withIntel = ENTS.filter(e=>e.sc!==null && e.sc!=='' && e.sc!==undefined).length;
  const totalPipes = ENTS.reduce((s,e)=>s+e.pc,0);
  const totalRec = ENTS.reduce((s,e)=>s+e.rc,0);
  const overview = [
    {'指标':'研发企业总数','数值':META.total_enterprises},
    {'指标':'靶点总数','数值':META.total_targets},
    {'指标':'管线总数(去重)','数值':totalPipes},
    {'指标':'临床试验记录','数值':totalRec},
    {'指标':'有intel商务评分企业','数值':withIntel},
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(overview), '核心统计');
  // Sheet2: 技术路线分布
  const modRows = MODS.filter(m=>modFreq[m]).map(m=>({
    '技术路线': m, '企业数': modFreq[m]
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(modRows), '技术路线分布');
  // Sheet3: Top50靶点
  const targetRows = TARGETS.slice(0,50).map(t=>({
    '靶点': t, '覆盖企业数': targetFreq[t]
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(targetRows), 'Top50靶点');
  XLSX.writeFile(wb, `工作台总览统计_${ts()}.xlsx`);
}

// ============ 一键导出全部（9技术路线分Sheet） ============
function exportAll(){
  if(typeof XLSX === 'undefined'){ alert('Excel 导出组件未加载成功，请检查网络后刷新重试。'); return; }
  const wb = XLSX.utils.book_new();
  // Sheet0: 说明
  const note = [
    {'说明':'本工作簿为「靶点×技术路线客户开拓工作台」全量数据导出'},
    {'数据源':'医药魔方临床试验登记 × intel工作台商务评分'},
    {'导出时间': new Date().toLocaleString('zh-CN')},
    {'企业总数': META.total_enterprises},
    {'口径':'企业按集团归并；技术路线归并9大类；靶点已归一化'},
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(note), '说明');
  // 每个技术路线一个 Sheet
  MODS.forEach(m=>{
    const list = ENTS.filter(e=>e.md.includes(m)).sort((a,b)=>{
      const sa = (a.sc!==null&&a.sc!=='')?a.sc:0;
      const sb = (b.sc!==null&&b.sc!=='')?b.sc:0;
      return sb-sa || b.pc-a.pc;
    });
    const rows = list.map(e=>({
      '企业': e.n,
      '评分': (e.sc!==null&&e.sc!=='')?e.sc:'',
      '优先级': e.pr||'',
      '相关性档': e.rl||'',
      '管线数': e.pc,
      '最高阶段': e.ph||'',
      '核心靶点': e.tg.join('、'),
      '适应症': e.ind.join('、'),
      '推荐产品线': e.pd||'',
    }));
    // Sheet 名不能超过31字符，且不能含特殊字符
    const safeName = m.replace(/[\\/:*?\[\]()]/g, '-').slice(0,28);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), safeName);
  });
  XLSX.writeFile(wb, `靶点技术路线工作台_全量导出_${ts()}.xlsx`);
}
